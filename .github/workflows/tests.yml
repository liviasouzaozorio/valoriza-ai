name: ValorizAI tests

on:
  push:
    branches:
      - main
      - feat/auth-and-auth-ui
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check backend syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Generate patched lockfile
        run: |
          npm audit fix --package-lock-only
          mkdir -p audit-artifact
          cp package-lock.json audit-artifact/package-lock.json
      - name: Commit patched lockfile once
        if: github.event_name == 'push' && github.event.head_commit.message == 'Generate patched dependency lockfile for review'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "chore(deps): patch vulnerable transitive dependencies"
            git push
          fi
      - name: Upload patched lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: audit-artifact/package-lock.json
      - name: Report dependency advisories
        run: npm audit --json || true
