name: ValorizAI tests

on:
  push:
    branches:
      - main
      - feat/auth-and-auth-ui
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check backend syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
