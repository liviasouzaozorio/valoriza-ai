<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" fill="none">
    <defs>
      <linearGradient id="nilo-recomendacao-shell" x1="70" y1="30" x2="175" y2="235" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="45%" stop-color="#F1F5F9" />
        <stop offset="100%" stop-color="#CBD5E1" />
      </linearGradient>
      <linearGradient id="nilo-recomendacao-shell-dark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#E2E8F0" />
        <stop offset="100%" stop-color="#94A3B8" />
      </linearGradient>
      <linearGradient id="nilo-recomendacao-visor" x1="65" y1="54" x2="175" y2="118" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0B1320" />
        <stop offset="60%" stop-color="#152236" />
        <stop offset="100%" stop-color="#1E314D" />
      </linearGradient>
      <linearGradient id="nilo-recomendacao-eye" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#55D6A0" />
        <stop offset="100%" stop-color="#38BDF8" />
      </linearGradient>
      <linearGradient id="nilo-recomendacao-v-right" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#3986D8" />
        <stop offset="100%" stop-color="#55D6A0" />
      </linearGradient>
      <radialGradient id="nilo-recomendacao-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#090E17" stop-opacity="0.65" />
        <stop offset="100%" stop-color="#090E17" stop-opacity="0" />
      </radialGradient>
      <filter id="nilo-recomendacao-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.2" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Sombra flutuante de base -->
    <ellipse cx="120" cy="252" rx="48" ry="10" fill="url(#nilo-recomendacao-shadow)" />
    <ellipse cx="120" cy="242" rx="28" ry="4" fill="#55D6A0" fill-opacity="0.16" />

    
        <g transform="translate(156, 72)">
          <rect x="0" y="0" width="60" height="40" rx="8" fill="#19263A" stroke="#55D6A0" stroke-width="1.4" />
          <path d="M12 24 L19 16 L26 20 L38 11" stroke="#55D6A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          <line x1="12" y1="30" x2="46" y2="30" stroke="#A8B5C7" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" />
          <circle cx="48" cy="13" r="4" fill="#55D6A0" fill-opacity="0.25" />
          <circle cx="48" cy="13" r="2" fill="#55D6A0" />
        </g>
      

    <!-- Corpo / Torso compacto 3D -->
    <g>
      <!-- Base propulsora inferior discreta -->
      <path d="M96 220 C96 232 144 232 144 220 L138 208 L102 208 Z" fill="#19263A" />
      <ellipse cx="120" cy="226" rx="16" ry="3.2" fill="#55D6A0" fill-opacity="0.65" />

      <!-- Braços articulados -->
      
        <!-- Braço esquerdo -->
        <g>
          <path d="M72 152 C56 160 54 182 60 196" stroke="url(#nilo-recomendacao-shell)" stroke-width="15" stroke-linecap="round" fill="none" />
          <circle cx="67" cy="154" r="6" fill="#19263A" />
          <ellipse cx="61" cy="199" rx="8.5" ry="7" fill="url(#nilo-recomendacao-shell-dark)" />
        </g>
        <!-- Braço direito apontando para insight -->
        <g>
          <path d="M168 150 C184 146 192 132 186 118" stroke="url(#nilo-recomendacao-shell)" stroke-width="15" stroke-linecap="round" fill="none" />
          <circle cx="173" cy="147" r="6" fill="#19263A" />
          <ellipse cx="184" cy="115" rx="8.5" ry="7.5" fill="url(#nilo-recomendacao-shell)" />
        </g>
      

      <!-- Carcaça principal do tronco -->
      <path d="M74 146 C74 136 86 132 120 132 C154 132 166 136 166 146 L156 206 C154 218 140 223 120 223 C100 223 86 218 84 206 Z" fill="url(#nilo-recomendacao-shell)" stroke="#CBD5E1" stroke-width="1" />

      <!-- Linha de contorno lateral 3D -->
      <path d="M84 150 C88 143 104 140 120 140 C136 140 152 143 156 150" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7" fill="none" />

      <!-- Placa frontal do peito com símbolo geométrico V -->
      <rect x="97" y="153" width="46" height="40" rx="12" fill="#19263A" fill-opacity="0.06" stroke="#94A3B8" stroke-opacity="0.35" stroke-width="1" />
      <g transform="translate(106, 159) scale(0.58)">
        <path d="M6 10H15.5L24 30.5L19.2 40L6 10Z" fill="#3986D8" />
        <path d="M19.2 40L32.8 10H42L27.2 40H19.2Z" fill="url(#nilo-recomendacao-v-right)" />
      </g>

      <!-- Detalhes esmeralda nos ombros -->
      <path d="M77 148 Q82 142 89 141" stroke="#55D6A0" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <path d="M163 148 Q158 142 151 141" stroke="#55D6A0" stroke-width="2.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Pescoço articulado -->
    <rect x="105" y="122" width="30" height="14" rx="6" fill="#19263A" />
    <line x1="108" y1="129" x2="132" y2="129" stroke="#55D6A0" stroke-width="1.6" stroke-opacity="0.7" />

    <!-- Cabeça futurista arredondada -->
    <g transform="rotate(-3 120 88)">
      <!-- Pods auriculares laterais Navy + Esmeralda -->
      <rect x="48" y="71" width="14" height="32" rx="7" fill="#19263A" />
      <rect x="51" y="79" width="4" height="16" rx="2" fill="#55D6A0" />
      <rect x="178" y="71" width="14" height="32" rx="7" fill="#19263A" />
      <rect x="185" y="79" width="4" height="16" rx="2" fill="#55D6A0" />

      <!-- Antena técnica discreta no topo -->
      <rect x="116" y="29" width="8" height="11" rx="4" fill="#19263A" />
      <circle cx="120" cy="27" r="4.5" fill="#55D6A0" />

      <!-- Capacete / Carcaça craniana branca-pérola -->
      <rect x="57" y="38" width="126" height="90" rx="38" fill="url(#nilo-recomendacao-shell)" stroke="#CBD5E1" stroke-width="1.2" />
      <!-- Brilho superior de estúdio -->
      <path d="M78 46 C98 41 142 41 162 46" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-opacity="0.85" fill="none" />

      <!-- Visor frontal azul-marinho -->
      <rect x="69" y="54" width="102" height="60" rx="26" fill="url(#nilo-recomendacao-visor)" stroke="#334155" stroke-width="1.5" />
      <!-- Reflexo sutil no vidro do visor -->
      <path d="M82 62 C102 58 134 58 156 62" stroke="#F1F5F9" stroke-opacity="0.16" stroke-width="2.2" stroke-linecap="round" fill="none" />

      <!-- Olhos luminosos esmeralda/turquesa -->
      
      <rect x="86" y="76" width="18" height="18" rx="9" fill="url(#nilo-recomendacao-eye)" filter="url(#nilo-recomendacao-glow)" />
      <rect x="136" y="76" width="18" height="18" rx="9" fill="url(#nilo-recomendacao-eye)" filter="url(#nilo-recomendacao-glow)" />
      <circle cx="92" cy="81" r="2.8" fill="#F1F5F9" opacity="0.85" />
      <circle cx="142" cy="81" r="2.8" fill="#F1F5F9" opacity="0.85" />
    

      <!-- Linha discreta de micro-interface na base do visor -->
      <rect x="112" y="103" width="16" height="2.6" rx="1.3" fill="#55D6A0" fill-opacity="0.45" />
    </g>
  </svg>