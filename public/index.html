<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValorizAI | Inteligência para decisões de preço</title>
    <meta name="description" content="Plataforma inteligente de apoio à precificação e tomada de decisões financeiras e operacionais para micro e pequenos empreendedores.">
    <meta property="og:title" content="ValorizAI | Inteligência para decisões de preço">
    <meta property="og:description" content="Mais clareza. Melhores decisões. Precifique produtos e serviços com clareza de custos, margens e apoio do Consultor IA.">
    <link rel="icon" type="image/svg+xml" href="/img-valorizaai/logos/valorizai-symbol-gradient-dark.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/img-valorizaai/tokens/tokens.css">
    <link rel="stylesheet" href="/styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth-config.js"></script>
    <style>html.auth-checking body{visibility:hidden}</style>
    <script src="/auth-guard.js"></script>
    <script src="/logout.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="/script.js" defer></script>
</head>
<body>
    <div id="app-shell" class="app-shell">
        <!-- Mobile Drawer Backdrop -->
        <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
            <div class="sidebar-header">
                <a href="#dashboard" class="sidebar-brand" data-nav="dashboard" aria-label="ValorizAI — Ir para a Visão geral">
                    <img src="/img-valorizaai/logos/valorizai-horizontal-gradient-dark.svg" alt="ValorizAI" class="brand-logo-full">
                    <img src="/img-valorizaai/logos/valorizai-symbol-gradient-dark.svg" alt="ValorizAI" class="brand-logo-symbol">
                </a>
                <button type="button" id="sidebar-collapse-btn" class="icon-btn sidebar-collapse-btn" aria-label="Recolher menu lateral" aria-expanded="true" title="Recolher menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                </button>
                <button type="button" id="sidebar-close-mobile-btn" class="icon-btn sidebar-close-mobile" aria-label="Fechar menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav">
                <button type="button" class="nav-item active" data-nav="dashboard" data-tooltip="Visão geral">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
                        <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
                        <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
                        <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
                    </svg>
                    <span class="nav-label">Visão geral</span>
                </button>



                <button type="button" class="nav-item" data-nav="catalogo" data-tooltip="Produtos e serviços">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span class="nav-label">Produtos e serviços</span>
                </button>

                <button type="button" class="nav-item" data-nav="precificacao" data-tooltip="Nova precificação">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                        <line x1="8" y1="6" x2="16" y2="6"></line>
                        <line x1="8" y1="10" x2="10" y2="10"></line>
                        <line x1="14" y1="10" x2="16" y2="10"></line>
                        <line x1="8" y1="14" x2="10" y2="14"></line>
                        <line x1="14" y1="14" x2="16" y2="14"></line>
                        <line x1="8" y1="18" x2="16" y2="18"></line>
                    </svg>
                    <span class="nav-label">Nova precificação</span>
                </button>

                <button type="button" class="nav-item" data-nav="simulacao" data-tooltip="Simulação rápida">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span class="nav-label">Simulação rápida</span>
                </button>

                <button type="button" class="nav-item" data-nav="historico" data-tooltip="Histórico">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polyline points="12 7 12 12 15.5 14"></polyline>
                    </svg>
                    <span class="nav-label">Histórico</span>
                </button>

                <button type="button" class="nav-item" data-nav="analises" data-tooltip="Custos e rentabilidade">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span class="nav-label">Custos e rentabilidade</span>
                </button>

                <button type="button" class="nav-item" data-nav="consultor" data-tooltip="Nilo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="nav-label">Nilo</span>
                </button>

                <button type="button" class="nav-item" data-nav="negocio" data-tooltip="Perfil da empresa">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 21h18"></path>
                        <path d="M5 21V7l8-4v18"></path>
                        <path d="M19 21V11l-6-4"></path>
                        <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"></path>
                    </svg>
                    <span class="nav-label">Perfil da empresa</span>
                </button>

                <div class="sidebar-divider" role="separator"></div>

                <button type="button" class="nav-item" data-nav="conta" data-tooltip="Minha conta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21a8 8 0 0 1 16 0"></path>
                    </svg>
                    <span class="nav-label">Minha conta</span>
                </button>

                <button type="button" class="nav-item" data-nav="configuracoes" data-tooltip="Configurações">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span class="nav-label">Configurações</span>
                </button>

                <button type="button" id="logout-btn" class="nav-item" data-tooltip="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span class="nav-label">Sair</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-business-summary" id="sidebar-business-summary">
                    <div class="sidebar-business-name" id="sidebar-business-name">Meu Negócio</div>
                    <div class="sidebar-business-meta" id="sidebar-business-sector">Defina seu segmento</div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <div class="workspace-main">
            <header class="topbar">
                <div class="topbar-left">
                    <button type="button" id="mobile-menu-btn" class="icon-btn mobile-menu-btn" aria-label="Abrir menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="topbar-context">
                        <span id="topbar-view-title" class="topbar-title">Visão geral</span>
                        <span class="topbar-sep" aria-hidden="true">·</span>
                        <span id="topbar-date" class="topbar-date"></span>
                    </div>
                </div>

                <div class="topbar-actions">
                    <div class="notifications-wrapper">
                        <button type="button" id="notifications-btn" class="icon-btn notifications-btn" aria-label="Notificações e alertas" aria-expanded="false" aria-haspopup="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                            <span id="notifications-count" class="notifications-count hidden">0</span>
                        </button>
                        <div id="notifications-popover" class="notifications-popover hidden" role="dialog" aria-label="Alertas do negócio">
                            <div class="popover-header">
                                <span>Alertas e lembretes</span>
                            </div>
                            <div id="notifications-list" class="popover-body"></div>
                        </div>
                    </div>

                    <button type="button" id="topbar-new-pricing-btn" class="btn btn-primary btn-sm">
                        Nova precificação
                    </button>
                </div>
            </header>

            <main id="main-viewport" class="main-viewport" tabindex="-1">
                <!-- Dynamic Screen Content Rendered by script.js -->
            </main>
        </div>
    </div>

    <!-- Modal / Detail Container -->
    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-backdrop" id="modal-backdrop"></div>
        <div class="modal-panel" id="modal-panel">
            <div class="modal-header">
                <h2 id="modal-title" class="modal-title"></h2>
                <button type="button" id="modal-close-btn" class="icon-btn" aria-label="Fechar janela">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="modal-body" class="modal-body"></div>
        </div>
    </div>

    <!-- Toast Feedback Region -->
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
